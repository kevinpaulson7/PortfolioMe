name: Deploy Blazor to GitHub Pages

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview' # Change to '9.0.x' if your project targets .NET 9

    - name: Publish Blazor App
      run: dotnet publish Portfolio/Portfolio.csproj -c Release -o release

    - name: Fix SPA 404 Routing & Jekyll
      run: |
        cp release/wwwroot/index.html release/wwwroot/404.html
        touch release/wwwroot/.nojekyll

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: release/wwwroot

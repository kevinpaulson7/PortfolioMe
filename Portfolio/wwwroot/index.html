<!DOCTYPE html>
<html lang="en">
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevin Paulson | Software Engineer</title>
    <base href="/PortfolioMe/" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AOS Animations -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
                                window.initAOS = () => {
                                    AOS.init({
                                        duration: 800,
                                        once: false,
                                        offset: 100 // Triggers slightly earlier when scrolling
                                    });

                                    // Force AOS to recalculate the positions of the Blazor elements
                                    setTimeout(() => { AOS.refresh(); }, 200);
                                }
                            window.initTyped = () => {
                                new Typed('#typed-greeting', {
                                    strings: ['Heyy', 'Hey', 'He', 'H', 'He', 'Hey', 'Heyy'], // Types, backspaces, types again
                                    typeSpeed: 200,
                                    backSpeed: 200,
                                    backDelay: 150,
                                    loop: true,
                                    cursorChar: '|'
                                });
                            };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
